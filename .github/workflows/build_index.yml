name: Build RAG Embeddings & FAISS Index

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size for embedding'
        required: false
        default: '128'
      run_full_pipeline:
        description: 'Re-run full pipeline (download -> extract -> chunk) if chunks.jsonl is missing'
        type: boolean
        default: true

jobs:
  build-index:
    name: Generate Embeddings and FAISS Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Chunks (if missing)
        if: ${{ inputs.run_full_pipeline }}
        run: |
          if [ ! -f "chunks.jsonl" ]; then
            echo "chunks.jsonl not found in repo, running stages 1-3..."
            python download_pdfs.py
            python extract_pdfs_local.py
            python chunk_documents.py
          else
            echo "chunks.jsonl found in repo."
          fi

      - name: Generate Embeddings
        run: |
          python embed_chunks.py --batch ${{ inputs.batch_size || '128' }}

      - name: Build FAISS Vector Index
        run: |
          python build_faiss.py

      - name: Upload Index Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-index-artifacts
          path: |
            chunks.jsonl
            embeddings.npy
            embeddings_meta.json
            faiss_store/
          retention-days: 30
